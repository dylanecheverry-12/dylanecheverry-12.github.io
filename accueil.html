    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(to bottom, #003366, #ffffff);
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            text-align: center;
            color: white;
        }

        h1 {
            color: white;
            font-size: 3rem;
            margin-top: 40px;
        }

        h2 {
            color: white;
            font-size: 2.5rem;
            margin-top: 20px;
        }

        .projects-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin-top: 40px;
        }

        .project-box {
            width: 280px;
            height: 200px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid white;
            border-radius: 15px;
            backdrop-filter: blur(6px);
            transition: 0.3s;
            cursor: pointer;
            overflow: hidden;
        }

        .project-box:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.25);
        }

        .project-box img {
            width: 100%;
            height: 70%;
            object-fit: cover;
        }

        .project-title {
            margin-top: 5px;
            font-size: 1.4rem;
            font-weight: bold;
            color: white;
        }

        a {
            text-decoration: none;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            margin-top: 20px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 18px;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #218838;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            width: 100%;
            bottom: 0;
            
    }
        
    </style>
</head>
