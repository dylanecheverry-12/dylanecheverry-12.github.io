<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>La Géolocalisations</title>


    <style>

        /* Fond global : dégradé du bleu foncé vers le blanc */

        body {

            margin: 0;

            min-height: 100vh;

            background: linear-gradient(to bottom, #003366, #ffffff);

            background-repeat: no-repeat;

            background-attachment: fixed;

            text-align: center;

            color: white;

            font-family: Arial, sans-serif;

        }


        h1 {

            font-size: 3rem;

            margin-top: 40px;

        }


        h2 {

            font-size: 1.7rem;

            margin-top: -10px;

            font-weight: normal;

        }


        /* Iframe contenant le document Google Docs */

        iframe {

            display: block;

            margin: 40px auto 0 auto;   /* centré horizontalement */

            width: 90%;                 /* un peu de marge latérale */

            max-width: 800px;

            height: 600px;

            border: 2px solid #ffffff;

        }


        /* Image du logo */

        img {

            width: 230px;

            margin-top: 40px;

            border: 2px solid #ffffff; /* petite bordure pour le contraste */

        }


        /* Bouton de retour */

        .back-link {

            display: inline-block;

            margin-top: 30px;

            margin-bottom: 40px;   /* un peu dspace en bas */

            padding: 12px 24px;

            font-size: 1.5rem;

            font-weight: bold;

            color: #FFD700;           /* Jaune doré */

            background-color: #003366; /* Fond bleu foncé pour le contraste */

            text-decoration: none;

            border-radius: 8px;      /*coins arrondis */

            border: 2px solid #FFD700; /* bordure jaune */

            transition: background-color 0.3s, color 0.3s;

        }


        .back-link:hover {

            background-color: #FFD700;

            color: #003366;

            text-decoration: none;

        }

    </style>

</head>

<body>


    <h1>Activité Géolocalisation : </h1>


    <!-- 

        Google Docs ne peut pas être affiché avec /edit.

        Utilisation de /pub?embedded=true (ou /preview) pour l'afficher.

    -->

    <iframe 

        src="https://docs.google.com/document/d/1t3m9q_zl8AON8P7z2L3ckq_vIK-O2XYYuAcxI5mWBUc/pub?embedded=true"

        width="90%"

        height="600"

        style="border: none;"

        allowfullscreen>

        Votre navigateur ne supporte pas les iframes.

    </iframe>
